name: prm393_frontend
description: "PRM393 Parking Management System - Flutter Mobile & Web Client"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Design System
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0+1

  # Storage & Security
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  jwt_decoder: ^2.0.1
  qr_flutter: ^4.1.0
  local_auth: ^3.0.2
  image_picker: ^1.2.3

  # Maps
  flutter_map: ^7.0.2
  geolocator: ^14.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
