name: prm393_frontend
description: "PRM393 Parking Management System - Flutter Mobile & Web Client"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Design System
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0+1
  http_parser: ^4.1.2
  url_launcher: ^6.3.1

  # Storage & Security
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  jwt_decoder: ^2.0.1
  local_auth: ^3.0.2

  # Tickets & Camera
  qr_flutter: ^4.1.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
